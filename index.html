<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sam sailing">
<meta name="theme-color" content="#eef2f5">
<title>Sam Sailing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef2f5;--surface:#fff;--ink:#13202c;--muted:#596978;--line:#d6dee5;--soft:#e4eaef;
 --sailgp:#c41d3a;--m32:#1c5ccc;--rc44:#0a8273;--c31:#cf7210;--mr:#7347c2;--other:#5d6c79;--on-c:#fff;--ok:#16733a;
 --fd:"Saira Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Source Sans 3",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c131a;--surface:#151f29;--ink:#e5edf4;--muted:#93a4b4;--line:#26343f;--soft:#1c2833;
 --sailgp:#ff5d74;--m32:#609aff;--rc44:#2cc3ad;--c31:#f3a347;--mr:#ab8cff;--other:#a3b3c2;--on-c:#0c131a;--ok:#55d68a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:860px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line);z-index:5}
h1{font:700 28px/1 var(--fd);margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.now{margin-top:10px;font-size:16px}
.now b{font-weight:700}
nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px 10px;font:600 17px var(--fd);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;color:inherit}
nav button[aria-current]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:not([aria-current]){color:var(--muted)}
main{padding-top:16px;display:flex;flex-direction:column;gap:12px}
.cal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cal a.btn{background:var(--ink);color:var(--bg);text-decoration:none;border-radius:8px;padding:8px 14px;font-weight:600}
.cal span{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.mh{font:600 15px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 -2px}
.trip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px}
.trip .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--c)}
.trip h3{font:600 22px/1.1 var(--fd);margin:3px 0}
.trip .m{color:var(--muted);font-size:14px}
.trip .away{font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.strip i{width:14px;height:14px;border-radius:3px}
.home{display:flex;align-items:center;gap:10px;color:var(--ok);font-size:13px}
.home::before,.home::after{content:"";flex:1;border-top:1px dashed var(--line)}
.race{background:var(--c)}.train{background:color-mix(in srgb,var(--c) 58%,var(--surface))}.trav{background:color-mix(in srgb,var(--c) 24%,var(--surface))}.awy{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.yr{font:700 24px var(--fd);margin:6px 0 8px}
.planner{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:12px}
th{position:sticky;top:0;background:var(--surface);font:600 15px var(--fd);letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);width:120px;text-align:left}
td{width:120px;max-width:120px;height:24px;padding:0 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.we{background:var(--soft)}td.na{background:repeating-linear-gradient(135deg,var(--soft) 0 2px,transparent 2px 6px)}
td.race{color:var(--on-c)}td.tdy{box-shadow:inset 0 0 0 2px var(--ink)}
.dn{display:inline-block;width:17px;font-weight:600;font-variant-numeric:tabular-nums}.wd{display:inline-block;width:12px;opacity:.6}.nm{font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li i{flex:none;width:10px;height:28px;border-radius:2px;background:var(--c)}
.li.w i{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.li div{min-width:0}.li small{display:block;color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px}
@media (max-width:600px){th,td{width:100px;max-width:100px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Sam Sailing</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="now" id="now"></div>
  <nav id="nav"></nav>
</header>
<main id="view"><div class="empty">Loading the calendar…</div></main>
</div>
<script>
(function(){
const DAY=864e5, $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toN=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/DAY);
const toS=n=>new Date(n*DAY).toISOString().slice(0,10);
const dt=(n,o)=>new Date(n*DAY).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const dS=n=>dt(n,{day:'numeric',month:'short'}), dL=n=>dt(n,{weekday:'short',day:'numeric',month:'short'});
const range=(a,b)=>a===b?dS(a):(new Date(a*DAY).getUTCMonth()===new Date(b*DAY).getUTCMonth()?new Date(a*DAY).getUTCDate()+'–'+dS(b):dS(a)+' – '+dS(b));
const d0=new Date(), TODAY=toN(d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0'));
const SHORT={sailgp:'SGP',m32:'M32',rc44:'44',c31:'C31',mr:'MR',other:''};
const TL={out:'Travel',back:'Travel home',train:'Training',race:'Racing'};
const cv=c=>`var(--${c})`;
let D=null, tab='trips', wf='all';
const ICS=location.href.replace(/[^/]*$/,'')+'sam.ics';

function trips(){
  const ts=D.trips.filter(t=>toN(t.to)>=TODAY);
  if(!ts.length) return '<div class="empty">No trips planned.</div>';
  let h=`<div class="cal"><a class="btn" href="${ICS.replace(/^https?:/,'webcal:')}">Add to iPhone calendar</a><span>Subscribes your iPhone to Sam's trips. It updates by itself when plans change.</span></div>`;
  let lm='', prev=null;
  for(const t of ts){
    const f=toN(t.from), to=toN(t.to);
    if(prev && !t.after){ const g=f-toN(prev.to)-1; if(g>0) h+=`<div class="home">Sam home ${g} day${g>1?'s':''} · ${range(toN(prev.to)+1,f-1)}</div>`; }
    const m=dt(f,{month:'long',year:'numeric'}); if(m!==lm){ h+=`<div class="mh">${m}</div>`; lm=m; }
    const strip=t.days.map(([d,ty])=>`<i class="${ty==='race'?'race':ty==='train'?'train':'trav'}" title="${dL(toN(d))} · ${TL[ty]}"></i>`).join('');
    h+=`<article class="trip" style="--c:${cv(t.cls)}"><div class="k">${esc(t.label)}</div><h3>${esc(t.name)}</h3><div class="m">${esc(t.venue||'Venue TBC')} · ${t.camp?'Training':'Racing'} ${range(toN(t.race[0]),toN(t.race[1]))}</div>
      <div class="away">${t.after?'Straight on from the previous event':'Leaves <b>'+dL(f)+'</b>'} · ${t.next?'then straight on to the next':'home <b>'+dL(to)+'</b>'}</div><div class="strip">${strip}</div></article>`;
    prev=t;
  }
  return h;
}
function planner(){
  const map=new Map();
  D.trips.forEach(t=>t.days.forEach(([d,ty])=>{ if(!map.has(d)) map.set(d,{t,ty}); }));
  D.away.forEach(([d,id])=>{ if(!map.has(d)) map.set(d,{t:D.trips.find(x=>x.id===id),ty:'away'}); });
  let h=`<div class="legend">${Object.entries(D.classes).filter(([k])=>D.trips.some(t=>t.cls===k)).map(([k,l])=>`<span><i style="background:${cv(k)}"></i>${esc(l)}</span>`).join('')}
    <span><i class="race" style="--c:var(--muted)"></i>Racing</span><span><i class="train" style="--c:var(--muted)"></i>Training</span><span><i class="trav" style="--c:var(--muted)"></i>Travel</span><span><i class="awy" style="--c:var(--muted)"></i>Away between events</span></div>`;
  const y0=d0.getFullYear(), m0=d0.getMonth(); let last='';
  for(let y=y0;y<=2027;y++){
    const ms=[]; for(let m=(y===y0?m0:0);m<12;m++) ms.push(m);
    const f=ms.map(m=>Math.round(Date.UTC(y,m,1)/DAY)), dim=ms.map(m=>new Date(Date.UTC(y,m+1,0)).getUTCDate());
    let t=`<thead><tr>${ms.map((m,i)=>`<th>${dt(f[i],{month:'short'})}</th>`).join('')}</tr></thead><tbody>`;
    for(let d=1;d<=31;d++){ t+='<tr>'; ms.forEach((m,i)=>{
      if(d>dim[i]){t+='<td class="na"></td>';return;}
      const n=f[i]+d-1, wd=new Date(n*DAY).getUTCDay(), e=map.get(toS(n));
      let cls=(wd===0||wd===6)?'we':'', st='', nm='';
      if(e&&e.t){ cls={race:'race',train:'train',out:'trav',back:'trav',away:'awy'}[e.ty]; st=`style="--c:${cv(e.t.cls)}"`;
        const p=map.get(toS(n-1)); if((e.ty==='race'||e.ty==='train')&&(d===1||!p||p.t!==e.t||!(p.ty==='race'||p.ty==='train'))) nm=(SHORT[e.t.cls]?SHORT[e.t.cls]+' ':'')+e.t.name; }
      if(n===TODAY) cls+=' tdy';
      t+=`<td class="${cls}" ${st}><b class="dn">${d}</b><span class="wd">${'SMTWTFS'[wd]}</span>${nm?`<span class="nm">${esc(nm)}</span>`:''}</td>`; }); t+='</tr>'; }
    h+=`<div class="yr">${y}</div><div class="planner"><table>${t}</tbody></table></div>`;
  }
  return h;
}
function worldV(){
  const mine=D.trips.filter(t=>toN(t.to)>=TODAY).map(t=>({mine:true,cls:t.cls,name:t.name,venue:t.venue,start:t.race[0],end:t.race[1],group:t.label}));
  const groups=[...new Set(D.world.map(w=>w.group))];
  let all=mine.concat(D.world.map(w=>Object.assign({mine:false},w)));
  if(wf==='mine') all=all.filter(x=>x.mine); else if(wf!=='all') all=all.filter(x=>!x.mine&&x.group===wf);
  all.sort((a,b)=>a.start.localeCompare(b.start));
  let h=`<div class="filters">${[['all','Everything'],['mine',"Sam's events"],...groups.map(g=>[g,g])].map(([k,l])=>`<button aria-pressed="${wf===k}" data-wf="${esc(k)}">${esc(l)}</button>`).join('')}</div>`;
  let lm='', body='';
  for(const x of all){ const s=toN(x.start), e=toN(x.end); const m=dt(s,{month:'long',year:'numeric'});
    if(m!==lm){ if(body) h+=`<div class="list">${body}</div>`; body=''; h+=`<div class="mh">${m}</div>`; lm=m; }
    body+=`<div class="li ${x.mine?'':'w'}" style="--c:${x.mine?cv(x.cls):'var(--line)'}"><i></i><div><b>${esc(x.name)}</b><small>${range(s,e)} · ${esc(x.venue||'Venue TBC')} · ${esc(x.group)}${x.mine?' · Sam':''}</small></div></div>`; }
  if(body) h+=`<div class="list">${body}</div>`;
  return h;
}
function render(){
  $('nav').innerHTML=[['trips','Trips'],['planner','Planner'],['world','World']].map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('');
  if(!D) return;
  const cur=D.trips.find(t=>toN(t.from)<=TODAY&&toN(t.to)>=TODAY);
  if(cur){ let l=cur; while(l.next){ const n=D.trips.find(t=>t.id===l.next); if(!n) break; l=n; } $('now').innerHTML=`Sam is away at <b>${esc(cur.label)} ${esc(cur.name)}</b> · home <b>${dL(toN(l.to)+1)}</b>`; }
  else { const nx=D.trips.find(t=>toN(t.from)>TODAY); $('now').innerHTML=nx?`Sam is home · next trip <b>${dL(toN(nx.from))}</b>, ${esc(nx.label)} ${esc(nx.name)}`:'Sam is home'; }
  $('view').innerHTML=tab==='trips'?trips():tab==='planner'?planner():worldV();
}
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); scrollTo(0,0); } if(b.dataset.wf){ wf=b.dataset.wf; render(); } });
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{ D=d; $('sub').textContent='Updated '+new Date(d.updated).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}); render(); })
 .catch(()=>{ $('sub').textContent=''; $('view').innerHTML='<div class="empty">The calendar has not been published yet.</div>'; });
render();
})();
</script>
</body>
</html>
